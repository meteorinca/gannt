<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gantt</title>
<style>
:root{--lw:200px;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=dark]{--bg:#0d1420;--panel:#131c2e;--line:#24324c;--text:#e6edf7;--dim:#8b9bb4}
[data-theme=light]{--bg:#f4f6fa;--panel:#fff;--line:#dde3ec;--text:#0f172a;--dim:#64748b}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;transition:background .3s,color .3s}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
h1{font-size:14px;letter-spacing:.12em;text-transform:uppercase}
#sub{font-size:11px;color:var(--dim);font-family:monospace;margin-top:2px}
#thBtn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
#thBtn:hover{border-color:var(--dim)}
.wrap{padding:20px;overflow-x:auto}
table{border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:820px;width:100%}
th,td{border-left:1px solid var(--line);padding:0}
th{font-weight:600;font-size:12px;padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
th.mo{font-size:13px;border-bottom:none}
td.w{font-size:10px;color:var(--dim);font-family:monospace;text-align:center;padding:4px;border-bottom:1px solid var(--line)}
td.lbl{position:sticky;left:0;background:var(--panel);padding:10px 16px;font-size:12px;color:var(--dim);white-space:nowrap;z-index:2}
td.lbl b{display:block;color:var(--text);font-size:14px}
td.lbl i{font-style:normal;font-size:10px;font-family:monospace}
td.lbl i::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--pc);margin-right:6px}
td.trk{position:relative;height:38px;min-width:600px}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:18px;border-radius:9px;background:var(--pc);opacity:.9;cursor:default}
.bar:hover{opacity:1}
.bar.sum{height:24px;opacity:1}
.mile{position:absolute;top:50%;width:12px;height:12px;transform:translate(-50%,-50%) rotate(45deg);background:var(--pc);border-radius:2px}
.today{position:absolute;top:0;bottom:0;width:2px;background:#f43f5e;opacity:.85;pointer-events:none}
footer{padding:10px 20px 24px;font-size:11px;color:var(--dim);font-family:monospace}
</style>
<base target="_blank">
</head>
<body>
<header>
  <div><h1 id="t">Gantt</h1><div id="sub"></div></div>
  <button id="thBtn" title="Toggle theme">🌙</button>
</header>
<div class="wrap"><table id="g"></table></div>
<footer id="src"></footer>
<script>
/* Fallback data — used only if data.json is missing (e.g. opened via file://) */
var FB={"title":"Project Management","timeline":{"start":"2026-01-05","weeks":16},"projects":[
{"name":"Planning","owner":"Bob Johnson","color":"#f2b04d","tasks":[
{"name":"Set up team","start":"2026-01-05","end":"2026-01-25"},
{"name":"Set up budget","start":"2026-01-19","end":"2026-02-08"},
{"name":"Prepare launch plan","start":"2026-02-02","end":"2026-02-15"}]},
{"name":"Packaging","owner":"Henry Leblanc","color":"#c7d95f","tasks":[
{"name":"Prepare brief","start":"2026-01-26","end":"2026-02-15"},
{"name":"Develop ideas","start":"2026-02-09","end":"2026-03-01"}]},
{"name":"Marketing","owner":"Anne Hopkins","color":"#f58a5c","tasks":[
{"name":"Prepare brief","start":"2026-03-02","end":"2026-03-15"},
{"name":"Develop ideas","start":"2026-03-16","end":"2026-03-29"}]},
{"name":"Sales","owner":"Benjamin Otterson","color":"#4cc3e6","tasks":[
{"name":"Brief sales force","start":"2026-03-09","end":"2026-03-22"},
{"name":"Sales channels","start":"2026-03-23","end":"2026-04-19"}]},
{"name":"Collect Statistics","owner":"Kathy Gaines","color":"#f26d7d","tasks":[
{"name":"Sales figures","start":"2026-01-26","end":"2026-02-15"},
{"name":"New leads","start":"2026-02-16","end":"2026-03-08"},
{"name":"Review process","start":"2026-03-09","end":"2026-03-29"}]}]};

var root=document.documentElement,btn=document.getElementById('thBtn');
function theme(t){root.dataset.theme=t;btn.textContent=t=='dark'?'🌙':'☀️';try{localStorage.setItem('gt',t)}catch(e){}}
theme(function(){try{return localStorage.getItem('gt')}catch(e){return null}}()||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
btn.onclick=function(){theme(root.dataset.theme=='dark'?'light':'dark')};

function D(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function F(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}

function render(d){
  document.title=d.title;
  document.getElementById('t').textContent=d.title;
  var start=D(d.timeline.start),W=d.timeline.weeks,end=new Date(start.getTime()+W*7*864e5);
  document.getElementById('sub').textContent=F(start)+' → '+F(end)+' · '+W+' weeks';
  var P=function(s){return Math.max(0,Math.min(100,(D(s)-start)/(end-start)*100))};
  var g=document.getElementById('g'),h='';

  /* header: one <th> per week, grouped visually under month names */
  var cur=new Date(start),wk=0,moRows='',wkRows='',lblRow='<tr><td class="lbl"></td>';
  while(cur<end&&wk<W){
    var m=cur.toLocaleDateString('en-US',{month:'long'}),n=0;
    while(cur<end&&cur.toLocaleDateString('en-US',{month:'long'})==m&&wk<W){n++;cur.setDate(cur.getDate()+7);wk++}
    moRows+='<th class="mo" colspan="'+n+'">'+m+'</th>';
  }
  for(var i=0;i<W;i++)wkRows+='<td class="w">W'+(i%4+1)+'</td>';
  h+='<tr><td class="lbl"></td>'+moRows+'</tr><tr><td class="lbl"></td>'+wkRows+'</tr>';

  /* project rows: summary bar, then one row per task */
  d.projects.forEach(function(p){
    var s=p.tasks.reduce(function(a,t){return t.start<a?t.start:a},p.tasks[0].start);
    var e=p.tasks.reduce(function(a,t){return t.end>a?t.end:a},p.tasks[0].end);
    var l='<td class="lbl" style="--pc:'+p.color+'"><b>'+p.name+'</b><i>'+(p.owner||'')+'</i></td>';
    h+='<tr>'+l+'<td class="trk"><div class="bar sum" style="--pc:'+p.color+';left:'+P(s)+'%;width:'+(P(e)-P(s))+'%" title="'+p.name+' · '+p.owner+'\n'+F(D(s))+' → '+F(D(e))+'"></div></td></tr>';
    p.tasks.forEach(function(t){
      var inner;
      if(t.milestone){inner='<div class="mile" style="--pc:'+p.color+';left:'+P(t.start)+'%" title="◆ '+t.name+' · '+F(D(t.start))+'"></div>'}
      else{inner='<div class="bar" style="--pc:'+p.color+';left:'+P(t.start)+'%;width:'+Math.max(P(t.end)-P(t.start),1)+'%" title="'+t.name+'\n'+F(D(t.start))+' → '+F(D(t.end))+'"></div>'}
      h+='<tr>'+l.replace('class="lbl"','class="lbl"')+'<td class="trk">'+inner+'</td></tr>';
    });
  });
  g.innerHTML=h;

  /* today line */
  var now=new Date();
  if(now>=start&&now<=end){
    var tl=document.createElement('div');tl.className='today';
    tl.style.left=((now-start)/(end-start)*100)+'%';
    g.querySelectorAll('td.trk').forEach(function(td){td.appendChild(tl.cloneNode())});
  }
}

fetch('data.json',{cache:'no-store'}).then(function(r){
  if(!r.ok)throw 0;return r.json();
}).then(function(d){
  render(d);document.getElementById('src').textContent='source: data.json ✓';
}).catch(function(){
  render(FB);document.getElementById('src').textContent='source: embedded fallback (data.json not found)';
});
</script>
</body>
</html>
